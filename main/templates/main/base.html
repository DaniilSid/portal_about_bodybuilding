<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Фитнес Портал{% endblock %}</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .article-card img { height: 200px; object-fit: cover; }
        .article-card { transition: transform 0.2s; }
        .article-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- ШАПКА САЙТА С 6 РАЗДЕЛАМИ -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="{% url 'home' %}">🏋️‍♂️ FIT-PORTAL</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <!-- 1. Главная -->
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active fw-bold text-warning{% endif %}" 
                           href="{% url 'home' %}">Главная</a>
                    </li>
                    
                    <!-- 2-6. Динамические разделы из БД -->
                    {% for cat in nav_categories %}
                        <li class="nav-item">
                            <a class="nav-link {% if category.slug == cat.slug %}active fw-bold text-warning{% endif %}" 
                               href="{% url 'category_detail' slug=cat.slug %}">{{ cat.name }}</a>
                        </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </nav>

    <!-- ХЛЕБНЫЕ КРОШКИ (Путь до места на сайте) -->
    <div class="bg-white border-bottom py-2 mb-4">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb m-0">
                    {% block breadcrumbs %}
                        <li class="breadcrumb-item active">Главная</li>
                    {% endblock %}
                </ol>
            </nav>
        </div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div class="container flex-grow-1">
        {% block content %}{% endblock %}
    </div>

    <!-- ПОДВАЛ -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="m-0">&copy; 2026 FIT-PORTAL. Все права защищены.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
